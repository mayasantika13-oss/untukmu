<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu </title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffe6e6, #ffb3b3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 100%;
        }
        .heart {
            position: relative;
            width: 80px;
            height: 70px;
            margin: 0 auto 30px auto;
            animation: beat 0.8s infinite alternate;
        }
        .heart:before, .heart:after {
            position: absolute;
            content: "";
            left: 40px;
            top: 0;
            width: 40px;
            height: 65px;
            background: #ff4d6d;
            border-radius: 50px 50px 0 0;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }
        .heart:after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }
        h1 {
            color: #ff4d6d;
            font-size: 24px;
            margin-bottom: 15px;
            min-height: 35px;
        }
        p {
            color: #4a4a4a;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #btnSuka {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }
        #btnGakSuka {
            background-color: #cccccc;
            color: #666666;
            position: relative;
        }
        @keyframes beat {
            to { transform: scale(1.15); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="heart"></div>
    <h1 id="textJudul"></h1>
    <p id="textDeskripsi">Aku mau ngomong sesuatu... Sebenernya aku udah lama suka sama kamu</p>
    

    <p>Kamu juga suka gak sama aku?</p>
    <div class="btn-group">
        <button id="btnSuka" onclick="terima()">Suka ❤️</button>
        <button id="btnGakSuka" onmouseover="hindar()" onclick="hindar()">Gak Suka</button>
    </div>
</div>

<script>
    // EDIT NOMOR WHATSAPP ANDA DI SINI (Gunakan kode negara, misal 62812xxxx)
    const nomorWA = "62895342342512"; 
    
    // Efek mengetik otomatis pada judul
    const judul = "Hai Kamu... ✨";
    let i = 0;
    function typeWriter() {
        if (i < judul.length) {
            document.getElementById("textJudul").innerHTML += judul.charAt(i);
            i++;
            setTimeout(typeWriter, 150);
        }
    }
    window.onload = typeWriter;

    // Fungsi membuat tombol "Gak Suka" menghindar saat didekati/diklik
    function hindar() {
        const btnGakSuka = document.getElementById("btnGakSuka");
        const x = Math.random() * (window.innerWidth - btnGakSuka.offsetWidth - 50);
        const y = Math.random() * (window.innerHeight - btnGakSuka.offsetHeight - 50);
        
        btnGakSuka.style.position = "fixed";
        btnGakSuka.style.left = x + "px";
        btnGakSuka.style.top = y + "px";
    }

    // Fungsi saat tombol "Suka" diklik (mengarahkan ke WhatsApp)
    function terima() {
        const pesan = encodeURIComponent("Aku juga suka sama kamu! ❤️🥰");
        window.location.href = `https://wa.me/${nomorWA}?text=${pesan}`;
}
</script>

</body>
</html>
